appId: com.batchreader.app
productName: BatchReader
executableName: BatchReader

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - "!out/**/*.map"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: lenixeduardo
  repo: leitor-industrial
